$schema: "https://json-schema.org/draft/2020-12/schema"
description: Configuration schema for generate_divref_from_tsv.smk

type: object
additionalProperties: false

properties:
  reference_genome_uri:
    type: string
    description: |
      URI for the reference genome FASTA. Both `gs://` and `s3://` are supported; the rule
      detects the scheme. The default is a gzipped FASTA on GCS; the S3 alternative is the
      uncompressed `s3://broad-references/hg38/v0/Homo_sapiens_assembly38.fasta` on AWS Open Data.
    default: gs://hail-common/references/Homo_sapiens_assembly38.fasta.gz

  reference_genome_base_name:
    type: string
    description: Base name for the reference genome.
    default: Homo_sapiens_assembly38

  chromosomes:
    type: array
    items:
      type: string
      # chr1-chr22, chrX, chrY; rejects typos (chrM, chr23, ...) at config-validation time
      # rather than deep in a "no rule to produce ..." error.
      pattern: "^chr([1-9]|1[0-9]|2[0-2]|X|Y)$"
    minItems: 1
    uniqueItems: true
    description: List of chromosomes to generate the resource for.
    default: ["chr1", "chr2", "chr3", "chr4", "chr5", "chr6", "chr7", "chr8", "chr9", "chr10", "chr11", "chr12", "chr13", "chr14", "chr15", "chr16", "chr17", "chr18", "chr19", "chr20", "chr21", "chr22", "chrX", "chrY"]

  sequence_window_size:
    type: integer
    description: |
      Flanking reference-context size around each variant, used when constructing sequence
      strings and stored in the index.
    minimum: 1
    default: 25

  polars_chunk_size:
    type: integer
    minimum: 10000
    description: |
      Number of sequence table rows to read from the intermediate per-contig TSV and insert into
      the database at a time. Recommended maximum 1,000,000 for a typical laptop.
    default: 100000

  work_dir:
    type: string
    description: Path to the working directory for intermediate files.
    default: data/work

  tmp_dir:
    type: string
    description: Path to the temporary files directory.
    default: /tmp

  sources:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          # Interpolated into output paths and `{source}` wildcards before the CLI's own
          # identifier guard runs; match that guard (`create_duckdb_from_tsv._IDENTIFIER`).
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          description: Source identifier used to name this source's output files.
        variants_tsv:
          type: string
          description: |
            Path to the wide single-variant TSV for this source (`contig, pos, ref, alt` plus
            `AC_<pop>` / `AF_<pop>` per population).
        source_meta:
          type: string
          description: |
            Path to the `source_meta.yml` sidecar naming this source and its population legend.
      required:
        - name
        - variants_tsv
        - source_meta
    minItems: 1
    uniqueItems: true
    description: |
      Variation sources to build. Each source is built into its own DuckDB index and per-contig
      FASTA files, independent of the other sources.

required:
  - sources
